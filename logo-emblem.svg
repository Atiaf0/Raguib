<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyan to Emerald Gradient -->
    <linearGradient id="rqCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>

    <!-- Purple Gradient -->
    <linearGradient id="rqPurpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7B3FF2" />
    </linearGradient>

    <!-- Dark Shield Base Gradient -->
    <linearGradient id="rqShieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Isometric Shield Geometric Frame -->
  <!-- Top Roof Box -->
  <polygon points="120,18 205,62 120,106 35,62" fill="url(#rqShieldBg)" stroke="#00F0FF" stroke-width="7" stroke-linejoin="round" />
  <line x1="120" y1="18" x2="120" y2="106" stroke="#00F0FF" stroke-width="5" stroke-opacity="0.6" />

  <!-- Shield Side Boundaries -->
  <path d="M35 62 L35 155 Q35 210 120 258 Q205 210 205 155 L205 62" 
        fill="url(#rqShieldBg)" fill-opacity="0.85" 
        stroke="#00F0FF" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />

  <!-- The Surveillance Eye Center (رقيب) -->
  <!-- Eye Outer Contour -->
  <path d="M48 120 Q120 70 192 120 Q120 170 48 120 Z" 
        fill="#080E1A" stroke="#00F0FF" stroke-width="6" stroke-linejoin="round" />

  <!-- Eye Inner Iris Ring -->
  <circle cx="120" cy="120" r="28" fill="#020408" stroke="#7B3FF2" stroke-width="5" />

  <!-- Central Upward Telemetry Arrow (Teal/Cyan) -->
  <path d="M120 86 L134 104 L126 104 L126 138 L114 138 L114 104 L106 104 Z" 
        fill="url(#rqCyanGlow)" filter="url(#neonGlow)" />

  <!-- Bottom Dynamic Flow Arrows (Purple & Cyan Flow) -->
  <!-- Diagonal Left Cyan Flow Wing -->
  <path d="M60 148 L76 138 L92 178 L72 188 Z" 
        fill="#00F0FF" fill-opacity="0.9" />
  <polyline points="52,192 84,174 102,210" 
            stroke="#00F0FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diagonal Right Purple Ascent Arrow -->
  <path d="M124 235 L168 152 L178 158 L188 132 L158 138 L168 144 L114 246 Z" 
        fill="url(#rqPurpleGlow)" filter="url(#neonGlow)" />

  <!-- Diagonal Middle Fast Vector Arrow -->
  <path d="M85 220 L145 160 L155 166 L160 145 L140 152 L147 157 L78 226 Z" 
        fill="#00FF66" />
</svg>
